name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      curseforge_id:
        description: 'CurseForge Project ID (optional if set in repository secrets)'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Release Version'
        required: false
        type: string
        default: '1.0.0'
      release_type:
        description: 'Release Type'
        required: false
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Resolve Project Version & CurseForge ID
        id: vars
        run: |
          VERSION="${{ inputs.release_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
              VERSION="1.0.0"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          CF_ID="${{ inputs.curseforge_id }}"
          if [ -z "$CF_ID" ]; then
            CF_ID="${{ secrets.CURSEFORGE_PROJECT_ID || secrets.CF_PROJECT_ID || secrets.CURSEFORGE_ID || secrets.PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}"
          fi
          echo "cf_id=$CF_ID" >> $GITHUB_OUTPUT

      - name: Publish to CurseForge
        if: steps.vars.outputs.cf_id != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.vars.outputs.cf_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN || secrets.CF_TOKEN || secrets.CURSEFORGE_API_KEY || secrets.CF_API_KEY }}
          files: build/libs/justlights-*.jar
          name: "JustLights ${{ steps.vars.outputs.version }} (NeoForge 1.21.1)"
          version: ${{ steps.vars.outputs.version }}
          version-type: ${{ inputs.release_type || 'release' }}
          changelog-file: CURSEFORGE.md
          game-versions: |
            1.21.1
          loaders: |
            neoforge
          java: |
            Java 21

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.vars.outputs.version) }}
          name: "JustLights v${{ steps.vars.outputs.version }} (Minecraft 1.21.1 NeoForge)"
          body_path: CURSEFORGE.md
          files: build/libs/justlights-*.jar
          draft: false
          prerelease: ${{ inputs.release_type != 'release' && inputs.release_type != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
